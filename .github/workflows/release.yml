name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Early release: the code is built and tested on Windows, but the Hyper-V and VirtualBox paths have not been run end to end on real hypervisors yet. Install with scripts/install.ps1 from the zip, then run ``terminal-windows doctor``."
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 --title "terminal-windows ${{ github.ref_name }}" --notes $notes --generate-notes --prerelease
