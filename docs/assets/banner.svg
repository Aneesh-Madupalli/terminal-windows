<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="t d">
  <title id="t">terminal-windows</title>
  <desc id="d">A Windows desktop shown inside a terminal window, controlled from the terminal or by an AI agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <g transform="translate(560 36)">
    <rect width="300" height="188" rx="10" fill="#16161e" stroke="#414868" stroke-width="2"/>
    <rect width="300" height="26" rx="10" fill="#292e42"/>
    <rect y="14" width="300" height="12" fill="#292e42"/>
    <circle cx="16" cy="13" r="5" fill="#f7768e"/>
    <circle cx="34" cy="13" r="5" fill="#e0af68"/>
    <circle cx="52" cy="13" r="5" fill="#9ece6a"/>
    <text x="150" y="18" fill="#a9b1d6" font-family="Consolas, monospace" font-size="11" text-anchor="middle">terminal-windows view</text>
    <rect x="10" y="34" width="280" height="130" rx="4" fill="url(#screen)"/>
    <rect x="10" y="144" width="280" height="20" fill="#e6eefc" opacity="0.92"/>
    <rect x="16" y="148" width="12" height="12" rx="2" fill="#0078d4"/>
    <rect x="34" y="148" width="12" height="12" rx="2" fill="#9ece6a"/>
    <rect x="52" y="148" width="12" height="12" rx="2" fill="#e0af68"/>
    <rect x="60" y="54" width="110" height="70" rx="5" fill="#ffffff" opacity="0.95"/>
    <rect x="60" y="54" width="110" height="14" rx="5" fill="#d0d7e5"/>
    <rect x="68" y="78" width="80" height="5" rx="2" fill="#9aa5b8"/>
    <rect x="68" y="90" width="94" height="5" rx="2" fill="#9aa5b8"/>
    <rect x="68" y="102" width="60" height="5" rx="2" fill="#9aa5b8"/>
    <path d="M196 84 l0 28 l8 -7 l6 13 l6 -3 l-6 -13 l11 0 z" fill="#1a1b26" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="14" y="180" fill="#9ece6a" font-family="Consolas, monospace" font-size="10">● live   default   sixel   Ctrl+G menu</text>
  </g>

  <text x="48" y="104" fill="#c0caf5" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">terminal-windows</text>
  <text x="48" y="144" fill="#a9b1d6" font-family="Segoe UI, Arial, sans-serif" font-size="20">A separate Windows PC you and your AI agents</text>
  <text x="48" y="172" fill="#a9b1d6" font-family="Segoe UI, Arial, sans-serif" font-size="20">can see and control, right from the terminal.</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#7dcfff">
    <text x="48" y="212">Hyper-V</text>
    <text x="130" y="212" fill="#565f89">·</text>
    <text x="146" y="212">VirtualBox</text>
    <text x="244" y="212" fill="#565f89">·</text>
    <text x="260" y="212">MCP</text>
    <text x="312" y="212" fill="#565f89">·</text>
    <text x="328" y="212">Sixel viewer</text>
  </g>
</svg>
